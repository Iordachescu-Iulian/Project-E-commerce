<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 720" width="1360" height="720" role="img">
<style>
  text { font-family: Arial, Helvetica, sans-serif; fill: #F4F2EC; }
  .title { font-size: 26px; font-weight: 700; letter-spacing: 0.14em; }
  .sub { font-size: 14px; fill: #B8B4CC; }
  .entity { font-size: 16px; font-weight: 700; }
  .field { font-size: 12.5px; fill: #F4F2EC; }
  .badge { font-size: 10px; font-weight: 700; }
  .rel { font-size: 12px; fill: #B8B4CC; }
  .note { font-size: 12px; fill: #B8B4CC; }
  .label { font-size: 13px; font-weight: 700; }
  .arrow-label { font-size: 12px; fill: #B8B4CC; }
</style>
<rect width="1360" height="720" fill="#14121F"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5FE0A4"/></marker></defs><text x="30" y="36" class="title">HEXORA — COMPONENT ARCHITECTURE</text><text x="30" y="58" class="sub">Next.js 14 full-stack monolith · Prisma · MySQL 8.0 · Stripe test mode</text><rect x="30" y="86" width="270" height="150" rx="12" fill="none" stroke="#55516B" stroke-dasharray="7 5"/><text x="46" y="112" class="label" fill="#A99BFF">CLIENT</text><rect x="46" y="124" width="238" height="96" rx="10" fill="#1E1B2E" stroke="#3A3650" stroke-width="1.2"/><rect x="46" y="124" width="5" height="96" rx="2.5" fill="#5B45E0"/><text x="66" y="154" class="entity">Browser</text><text x="66" y="180" class="field" fill="#B8B4CC">React 18 · Tailwind CSS</text><text x="66" y="201" class="field" fill="#B8B4CC">360 px → desktop</text><text x="66" y="222" class="field" fill="#B8B4CC">HTML + fetch calls</text><rect x="360" y="86" width="600" height="360" rx="12" fill="none" stroke="#55516B" stroke-dasharray="7 5"/><text x="376" y="112" class="label" fill="#A99BFF">NEXT.JS 14 SERVER (Node 18)</text><rect x="376" y="130" width="268" height="120" rx="10" fill="#1E1B2E" stroke="#3A3650" stroke-width="1.2"/><rect x="376" y="130" width="5" height="120" rx="2.5" fill="#5FE0A4"/><text x="396" y="160" class="entity">App Router pages</text><text x="396" y="186" class="field" fill="#B8B4CC">Server Components: catalog,</text><text x="396" y="207" class="field" fill="#B8B4CC">category, product, account</text><text x="396" y="228" class="field" fill="#B8B4CC">Client Components: forms,</text><text x="396" y="249" class="field" fill="#B8B4CC">search, address editor</text><rect x="668" y="130" width="276" height="120" rx="10" fill="#1E1B2E" stroke="#3A3650" stroke-width="1.2"/><rect x="668" y="130" width="5" height="120" rx="2.5" fill="#5FE0A4"/><text x="688" y="160" class="entity">API route handlers</text><text x="688" y="186" class="field" fill="#B8B4CC">/api/auth/*  /api/addresses/*</text><text x="688" y="207" class="field" fill="#B8B4CC">/api/products  /api/categories</text><text x="688" y="228" class="field" fill="#B8B4CC">/api/webhooks/stripe</text><text x="688" y="249" class="field" fill="#B8B4CC">Server-side guards on every route</text><rect x="376" y="276" width="268" height="150" rx="10" fill="#1E1B2E" stroke="#3A3650" stroke-width="1.2"/><rect x="376" y="276" width="5" height="150" rx="2.5" fill="#5FE0A4"/><text x="396" y="306" class="entity">Server-only layer</text><text x="396" y="332" class="field" fill="#B8B4CC">src/server/queries/*  (reads)</text><text x="396" y="353" class="field" fill="#B8B4CC">src/server/services/*  (writes)</text><text x="396" y="374" class="field" fill="#B8B4CC">src/lib/auth + session (JWT)</text><text x="396" y="395" class="field" fill="#B8B4CC">src/lib/security (origin check)</text><rect x="668" y="276" width="276" height="150" rx="10" fill="#1E1B2E" stroke="#3A3650" stroke-width="1.2"/><rect x="668" y="276" width="5" height="150" rx="2.5" fill="#5FE0A4"/><text x="688" y="306" class="entity">Shared libraries</text><text x="688" y="332" class="field" fill="#B8B4CC">src/lib/prisma.ts (singleton)</text><text x="688" y="353" class="field" fill="#B8B4CC">src/lib/stripe.ts (secret key)</text><text x="688" y="374" class="field" fill="#B8B4CC">Zod schemas + money helpers</text><text x="688" y="395" class="field" fill="#B8B4CC">No Prisma in Client Components</text><rect x="1030" y="86" width="290" height="150" rx="12" fill="none" stroke="#55516B" stroke-dasharray="7 5"/><text x="1046" y="112" class="label" fill="#A99BFF">DATA</text><rect x="1046" y="124" width="258" height="96" rx="10" fill="#1E1B2E" stroke="#3A3650" stroke-width="1.2"/><rect x="1046" y="124" width="5" height="96" rx="2.5" fill="#5FE0A4"/><text x="1066" y="154" class="entity">MySQL 8.0.36</text><text x="1066" y="180" class="field" fill="#B8B4CC">127.0.0.1:3307 (project local)</text><text x="1066" y="201" class="field" fill="#B8B4CC">13 tables · seeded 32 editions</text><text x="1066" y="222" class="field" fill="#B8B4CC">Transactions for stock</text><rect x="1030" y="290" width="290" height="156" rx="12" fill="none" stroke="#55516B" stroke-dasharray="7 5"/><text x="1046" y="316" class="label" fill="#A99BFF">EXTERNAL</text><rect x="1046" y="328" width="258" height="104" rx="10" fill="#1E1B2E" stroke="#3A3650" stroke-width="1.2"/><rect x="1046" y="328" width="5" height="104" rx="2.5" fill="#5B45E0"/><text x="1066" y="358" class="entity">Stripe (test mode)</text><text x="1066" y="384" class="field" fill="#B8B4CC">PaymentIntents (weeks 8–9)</text><text x="1066" y="405" class="field" fill="#B8B4CC">Signed webhook events</text><text x="1066" y="426" class="field" fill="#B8B4CC">No live keys, no real cards</text><rect x="376" y="520" width="568" height="96" rx="10" fill="#1E1B2E" stroke="#3A3650" stroke-width="1.2"/><rect x="376" y="520" width="5" height="96" rx="2.5" fill="#5FE0A4"/><text x="396" y="550" class="entity">Prisma ORM 5.22</text><text x="396" y="576" class="field" fill="#B8B4CC">Parameterised SQL · schema.prisma is the single source of truth</text><text x="396" y="597" class="field" fill="#B8B4CC">Migrations applied with prisma db push</text><rect x="46" y="520" width="270" height="96" rx="10" fill="#1E1B2E" stroke="#3A3650" stroke-width="1.2"/><rect x="46" y="520" width="5" height="96" rx="2.5" fill="#5FE0A4"/><text x="66" y="550" class="entity">Local assets</text><text x="66" y="576" class="field" fill="#B8B4CC">public/images/products/*.svg</text><text x="66" y="597" class="field" fill="#B8B4CC">Generated covers, no CDN</text><text x="66" y="618" class="field" fill="#B8B4CC">Fast, offline demo</text><line x1="284" y1="172" x2="360" y2="172" stroke="#5FE0A4" stroke-width="2" marker-end="url(#arrow)" /><rect x="305.0" y="152.0" width="34.0" height="17" fill="#14121F"/><text x="306.0" y="165.0" class="arrow-label">HTTPS</text><line x1="964" y1="190" x2="1030" y2="172" stroke="#5FE0A4" stroke-width="2" marker-end="url(#arrow)" /><rect x="986.8" y="161.0" width="20.4" height="17" fill="#14121F"/><text x="987.4" y="174.0" class="arrow-label">SQL</text><line x1="964" y1="380" x2="1030" y2="380" stroke="#5B45E0" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="963.0" y="360.0" width="68.0" height="17" fill="#14121F"/><text x="965.0" y="373.0" class="arrow-label">Stripe SDK</text><line x1="1175" y1="290" x2="1175" y2="328" stroke="#5FE0A4" stroke-width="2" marker-end="url(#arrow)" /><rect x="1151.2" y="289.0" width="47.6" height="17" fill="#14121F"/><text x="1152.6" y="302.0" class="arrow-label">webhook</text><line x1="660" y1="446" x2="660" y2="520" stroke="#5FE0A4" stroke-width="2" marker-end="url(#arrow)" /><rect x="615.8" y="463.0" width="88.39999999999999" height="17" fill="#14121F"/><text x="618.4" y="476.0" class="arrow-label">Prisma client</text><line x1="506" y1="520" x2="506" y2="446" stroke="#5FE0A4" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="444.8" y="463.0" width="122.39999999999999" height="17" fill="#14121F"/><text x="448.4" y="476.0" class="arrow-label">queries / services</text><text x="30" y="672" class="note">The Stripe secret key and webhook secret stay in .env on the server. The browser only sees the publishable key.</text><text x="30" y="692" class="note">Stripe confirms payments through the webhook, never through the browser redirect: the confirmation page only reads the database.</text>
</svg>
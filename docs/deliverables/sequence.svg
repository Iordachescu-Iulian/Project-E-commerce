<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 780" width="1360" height="780" role="img">
<style>
  text { font-family: Arial, Helvetica, sans-serif; fill: #F4F2EC; }
  .title { font-size: 26px; font-weight: 700; letter-spacing: 0.14em; }
  .sub { font-size: 14px; fill: #B8B4CC; }
  .entity { font-size: 16px; font-weight: 700; }
  .field { font-size: 12.5px; fill: #F4F2EC; }
  .badge { font-size: 10px; font-weight: 700; }
  .rel { font-size: 12px; fill: #B8B4CC; }
  .note { font-size: 12px; fill: #B8B4CC; }
  .label { font-size: 13px; font-weight: 700; }
  .arrow-label { font-size: 12px; fill: #B8B4CC; }
</style>
<rect width="1360" height="780" fill="#14121F"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5FE0A4"/></marker><marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#B8B4CC"/></marker></defs><text x="30" y="36" class="title">HEXORA — PAYMENT SEQUENCE</text><text x="30" y="58" class="sub">Critical flow: checkout → Stripe → webhook → order status → stock update</text><rect x="8" y="100" width="184" height="42" rx="8" fill="#2A2834" stroke="#3A3650"/><text x="100" y="126" class="entity" text-anchor="middle" fill="#5FE0A4">Customer</text><line x1="100" y1="142" x2="100" y2="760" stroke="#55516B" stroke-dasharray="5 5"/><rect x="238" y="100" width="184" height="42" rx="8" fill="#2A2834" stroke="#3A3650"/><text x="330" y="126" class="entity" text-anchor="middle" fill="#5B45E0">Browser / React</text><line x1="330" y1="142" x2="330" y2="760" stroke="#55516B" stroke-dasharray="5 5"/><rect x="468" y="100" width="184" height="42" rx="8" fill="#2A2834" stroke="#3A3650"/><text x="560" y="126" class="entity" text-anchor="middle" fill="#5FE0A4">Next.js server</text><line x1="560" y1="142" x2="560" y2="760" stroke="#55516B" stroke-dasharray="5 5"/><rect x="708" y="100" width="184" height="42" rx="8" fill="#2A2834" stroke="#3A3650"/><text x="800" y="126" class="entity" text-anchor="middle" fill="#A99BFF">MySQL</text><line x1="800" y1="142" x2="800" y2="760" stroke="#55516B" stroke-dasharray="5 5"/><rect x="948" y="100" width="184" height="42" rx="8" fill="#2A2834" stroke="#3A3650"/><text x="1040" y="126" class="entity" text-anchor="middle" fill="#5B45E0">Stripe test mode</text><line x1="1040" y1="142" x2="1040" y2="760" stroke="#55516B" stroke-dasharray="5 5"/><rect x="1178" y="100" width="184" height="42" rx="8" fill="#2A2834" stroke="#3A3650"/><text x="1270" y="126" class="entity" text-anchor="middle" fill="#5FE0A4">Webhook route</text><line x1="1270" y1="142" x2="1270" y2="760" stroke="#55516B" stroke-dasharray="5 5"/><line x1="330" y1="150" x2="556" y2="150" stroke="#5FE0A4" stroke-width="1.8" marker-end="url(#arrow)"/><text x="330" y="143" class="arrow-label" text-anchor="start">1  POST /api/checkout</text><line x1="560" y1="182" x2="796" y2="182" stroke="#5FE0A4" stroke-width="1.8" marker-end="url(#arrow)"/><text x="560" y="175" class="arrow-label" text-anchor="start">2  validate cart + stock, create Order NEW/UNPAID</text><line x1="560" y1="214" x2="1036" y2="214" stroke="#5FE0A4" stroke-width="1.8" marker-end="url(#arrow)"/><text x="568" y="207" class="arrow-label" text-anchor="start">3  create PaymentIntent (server-side amount)</text><line x1="1040" y1="246" x2="334" y2="246" stroke="#5FE0A4" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1032" y="239" class="arrow-label" text-anchor="end">4  client secret</text><line x1="330" y1="278" x2="1036" y2="278" stroke="#5FE0A4" stroke-width="1.8" marker-end="url(#arrow)"/><text x="338" y="271" class="arrow-label" text-anchor="start">5  confirm card 4242 4242 4242 4242</text><line x1="1040" y1="330" x2="1266" y2="330" stroke="#5FE0A4" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1040" y="323" class="arrow-label" text-anchor="start">6  payment_intent.succeeded (signed)</text><path d="M1270,378 h-56 v26 h56" fill="none" stroke="#5FE0A4" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1200" y="390" class="arrow-label" text-anchor="end">7  verify stripe-signature, unique PaymentEvent</text><line x1="1270" y1="426" x2="804" y2="426" stroke="#5FE0A4" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1262" y="419" class="arrow-label" text-anchor="end">8  tx: PAID + paidAt + stock −qty + history</text><line x1="1270" y1="470" x2="1044" y2="470" stroke="#5FE0A4" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1040" y="463" class="arrow-label" text-anchor="start">9  200 OK</text><line x1="100" y1="520" x2="326" y2="520" stroke="#5FE0A4" stroke-width="1.8" marker-end="url(#arrow)"/><text x="100" y="513" class="arrow-label" text-anchor="start">10  open confirmation page</text><line x1="330" y1="552" x2="556" y2="552" stroke="#5FE0A4" stroke-width="1.8" marker-end="url(#arrow)"/><text x="330" y="545" class="arrow-label" text-anchor="start">11  GET /orders/:id (reads DB only)</text><line x1="560" y1="584" x2="334" y2="584" stroke="#5FE0A4" stroke-width="1.8" marker-end="url(#arrow)"/><text x="330" y="577" class="arrow-label" text-anchor="start">12  order number + status PAID</text><rect x="30" y="632" width="580" height="104" rx="8" fill="#1E1B2E" stroke="#5FE0A4" stroke-opacity="0.5"/><text x="46" y="656" class="label" fill="#5FE0A4">IMPLEMENTED AT P2</text><text x="46" y="680" class="note">Steps 6–9: signature check, idempotent event, paid order and stock in one transaction.</text><text x="46" y="700" class="note">Invalid signature → 400. Duplicate event → duplicate:true and no side effects.</text><text x="46" y="720" class="note">Failed payment (payment_intent.payment_failed) leaves the order UNPAID.</text><rect x="640" y="632" width="620" height="104" rx="8" fill="#1E1B2E" stroke="#5B45E0" stroke-opacity="0.7"/><text x="656" y="656" class="label" fill="#A99BFF">WEEKS 8–9</text><text x="656" y="680" class="note">Steps 1–5 and 10–12: checkout UI, PaymentIntent creation, card confirmation and confirmation page.</text><text x="656" y="700" class="note">A browser redirect never marks an order paid. Only the signed webhook does.</text><text x="656" y="720" class="note">Cancellation restores stock exactly once via restoreStockForCancelledOrder.</text>
</svg>